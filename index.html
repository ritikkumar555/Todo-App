<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100">
    <div class="bg-white max-w-md mx-auto rounded-lg my-5">
        <div class="bg-indigo-500 text-white p-5 rounded-t-lg">
            <h1>Todo App</h1>
        </div>

        <div class="p-5">
            <form action="" id="todo-form" class="flex gap-5">
                <input id="todo-input" placeholder="Enter task description..." type="text" 
                class="border border-black flex-1 p-2">
                <button id="form-btn" class="px-5 py-3 text-white bg-violet-600">Add</button>
            </form>

            <div class="flex justify-between pt-6 pb-1 text-xs border-b border-black">
                <p>TASKS(1)</p>
                <p>COMPLETED : 1</p>
            </div>

            <ul class="py-5 flex flex-col gap-3" id="todo-list">
                <!-- <li data-id="1" class="flex gap-2 border
                 border-slate-300 p-4 rounded-xl">

                    <input data-id="1" type="checkbox">
                    <p class="flex-1">Go to Gym</p>
                    
                    <div class="flex gap-2">
                        <button data-id="1">Edit</button>
                        <button data-id="1">Delete</button>
                    </div>
                
                </li> -->
            </ul>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
